apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: ecommercedb
            - name: POSTGRES_USER
              value: ecommerceuser
            - name: POSTGRES_PASSWORD
              value: ecommercepass
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ecommerceuser", "-d", "ecommercedb"]
            initialDelaySeconds: 5
            periodSeconds: 5
