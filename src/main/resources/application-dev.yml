spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:ecommercedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/dev
  mail:
    host: localhost
    port: 1025          # MailHog SMTP port
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ecommerce-dev
      auto-offset-reset: earliest
  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:stub-key-not-used}
      chat:
        options:
          model: gpt-4o-mini

logging:
  level:
    com.example.ecommerce: DEBUG
    org.springframework.security: DEBUG
